[package]
name = "rms-memory-index"
version = "1.0.9"
edition = "2024"
description = "Storage, indexing, retrieval, and graphs for RMS Memory."
license = "MIT"
repository = "https://github.com/max-ramas/rms-memory-mcp"

[dependencies]
anyhow = "1.0.103"
blake3 = "1.8.5"
chrono = "0.4.45"
fastembed = "5.17.2"
futures = "0.3.32"
fs2 = "0.4.3"
glob = "0.3.3"
ignore = "0.4.28"
lance-index = "8.0.0"
lancedb = "0.31.0"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["download-binaries"] }
pathdiff = "0.2.3"
pulldown-cmark = "0.13.4"
regex = "1.12.4"
rms-memory-core = { version = "=1.0.9", path = "../rms-memory-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tree-sitter = "0.26.11"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.3"
tree-sitter-typescript = "0.23.2"
octorus-tree-sitter-vue3 = "0.1.0"
uuid = { version = "1.23.4", features = ["v4"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
