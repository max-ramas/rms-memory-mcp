[package]
name = "rms-memory-vault"
version = "1.0.9"
edition = "2024"
description = "Document and project services for RMS Memory."
license = "MIT"
repository = "https://github.com/max-ramas/rms-memory-mcp"

[dependencies]
anyhow = "1.0.103"
blake3 = "1.8.5"
chrono = "0.4.45"
dialoguer = "0.12.0"
dirs = "6.0.0"
pathdiff = "0.2.3"
rms-memory-core = { version = "=1.0.9", path = "../rms-memory-core" }
rms-memory-index = { version = "=1.0.9", path = "../rms-memory-index" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
tempfile = "3.27.0"
tracing = "0.1.44"
uuid = { version = "1.23.4", features = ["v4"] }
walkdir = "2.5.0"
