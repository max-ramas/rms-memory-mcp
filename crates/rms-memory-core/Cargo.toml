[package]
name = "rms-memory-core"
version = "1.1.0"
edition = "2024"
description = "Core documents, configuration, and workspace discovery for RMS Memory."
license = "MIT"
repository = "https://github.com/max-ramas/rms-memory-mcp"

[dependencies]
anyhow = "1.0.103"
blake3 = "1.8.5"
chrono = "0.4.45"
directories = "5.0.1"
fs2 = "0.4.3"
glob = "0.3.3"
notify = "8.2.0"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["sync"] }
toml = "1.1.2"
tracing = "0.1.44"
uuid = { version = "1.23.4", features = ["v4"] }

[dev-dependencies]
