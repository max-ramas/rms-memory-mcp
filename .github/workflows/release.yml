name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which targets to build (saves GH macOS/Windows minutes). Tag pushes always build all."
        required: false
        default: all
        type: choice
        options:
          - all
          - linux-x64
          - linux-arm
          - linux
          - macos
          - windows
      release_tag:
        description: "GitHub release tag to attach assets to (e.g. v1.0.6). Required for manual runs."
        required: true
        type: string
      publish_crates:
        description: Publish the package to crates.io after successful build + release upload
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan matrix
    runs-on: [self-hosted, linux, x64]
    outputs:
      include: ${{ steps.select.outputs.include }}
      release_tag: ${{ steps.select.outputs.release_tag }}
      version: ${{ steps.select.outputs.version }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          # Manual dispatch must build the commit the tag points at, not the
          # current branch tip. For tag pushes this resolves to the same tag.
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}

      - name: Select platforms and release tag
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLATFORMS: ${{ inputs.platforms || 'all' }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re

          all_rows = [
            {
              "id": "linux-x64",
              "os": ["self-hosted", "linux", "x64"],
              "target": "x86_64-unknown-linux-gnu",
              "archive_ext": "tar.gz",
              "use_cross": False,
              "apt": False,
              "persist_target": True,
            },
            {
              "id": "linux-arm",
              "os": "ubuntu-24.04-arm",
              "target": "aarch64-unknown-linux-gnu",
              "archive_ext": "tar.gz",
              "use_cross": False,
              "apt": True,
              "persist_target": False,
            },
            {
              "id": "macos",
              "os": "macos-latest",
              "target": "aarch64-apple-darwin",
              "archive_ext": "tar.gz",
              "use_cross": False,
              "apt": False,
              "persist_target": False,
            },
            {
              "id": "windows",
              "os": "windows-latest",
              "target": "x86_64-pc-windows-msvc",
              "archive_ext": "zip",
              "use_cross": False,
              "apt": False,
              "persist_target": False,
            },
          ]
          event = os.environ["EVENT_NAME"]
          platforms = os.environ.get("PLATFORMS") or "all"
          if event == "push" or platforms == "all":
            selected = all_rows
          elif platforms == "linux":
            selected = [r for r in all_rows if r["id"].startswith("linux")]
          else:
            wanted = {p.strip() for p in platforms.split(",") if p.strip()}
            selected = [r for r in all_rows if r["id"] in wanted]
          if not selected:
            raise SystemExit(f"no platforms matched: {platforms!r}")

          if event == "push":
            release_tag = os.environ["REF_NAME"]
          else:
            release_tag = (os.environ.get("INPUT_RELEASE_TAG") or "").strip()
            if not release_tag:
              raise SystemExit("release_tag is required for workflow_dispatch")
          if not re.fullmatch(r"v\d+\.\d+\.\d+", release_tag):
            raise SystemExit(f"release_tag must look like v1.0.6, got {release_tag!r}")

          # Version has exactly one source: the validated release tag. There is
          # no override input — every asset name and version check derives from
          # this single value, so an unversioned artifact is unrepresentable.
          version = release_tag[1:]  # strip leading v
          if not version:
            raise SystemExit(f"could not derive version from release_tag {release_tag!r}")

          print("Selected:", ", ".join(r["id"] for r in selected))
          print("Release tag:", release_tag)
          print("Version:", version)
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write(f"include={json.dumps(selected)}\n")
              fh.write(f"release_tag={release_tag}\n")
              fh.write(f"version={version}\n")
          PY

      - name: Verify Cargo version matches release tag
        shell: bash
        env:
          VERSION: ${{ steps.select.outputs.version }}
        run: |
          set -euo pipefail
          test -n "${VERSION}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          echo "Cargo.toml version: ${cargo_version}; release tag version: ${VERSION}"
          if [ "${cargo_version}" != "${VERSION}" ]; then
            echo "Cargo.toml version ${cargo_version} does not match release tag version ${VERSION}; refusing to build." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.include) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.release_tag }}

      - name: Persistent cargo target (self-hosted)
        if: matrix.persist_target == true
        run: |
          set -euo pipefail
          dir="${HOME}/.cache/rms-ci/rms-memory-mcp-release/target"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          echo "Using CARGO_TARGET_DIR=$dir"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install System Dependencies (GitHub-hosted Linux)
        # Self-hosted has no passwordless sudo; deps are preinstalled on the host.
        if: runner.os == 'Linux' && matrix.apt == true
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Verify System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          command -v pkg-config
          pkg-config --exists openssl
          echo "openssl $(pkg-config --modversion openssl)"

      - name: Restore Rust registry cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mcp-release-${{ matrix.target }}
          cache-targets: false

      - name: Install Cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Unix / Windows
        run: |
          set -euo pipefail
          TD="${CARGO_TARGET_DIR:-target}"
          if [ "${{ runner.os }}" == "macOS" ]; then
            cargo build --release --target ${{ matrix.target }}
            mkdir -p "$TD/release"
            cp "$TD/${{ matrix.target }}/release/rms-memory" "$TD/release/"
          else
            cargo build --release
          fi
        shell: bash

      - name: Install Packaging Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm
        shell: bash

      - name: Generate DEB & RPM (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          TD="${CARGO_TARGET_DIR:-target}"
          # The self-hosted release target is persistent, so stale packages from
          # previous versions survive here. Remove them before regenerating so we
          # only ever upload the current version's DEB/RPM (guards against the
          # 1.0.6 RPM that leaked into the 1.0.7 release).
          rm -rf "$TD/debian" "$TD/generate-rpm"
          cargo deb --no-build
          cargo generate-rpm
        shell: bash

      - name: Strip Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          TD="${CARGO_TARGET_DIR:-target}"
          strip "$TD/release/rms-memory"

      - name: Package (Unix / macOS)
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # Version is a mandatory output of the validated release tag. Assert it
          # so an unversioned archive is never produced (job fails instead).
          test -n "${VERSION}"
          TD="${CARGO_TARGET_DIR:-target}"
          mkdir -p staging
          cp "$TD/release/rms-memory" staging/rms-memory

          if [ "${{ runner.os }}" == "Linux" ]; then
            cp "$TD/debian"/*.deb staging/ 2>/dev/null || cp target/debian/*.deb staging/ || true
            cp "$TD/generate-rpm"/*.rpm staging/ 2>/dev/null || cp target/generate-rpm/*.rpm staging/ || true
          fi

          cd staging
          tar -czf "../rms_memory_mcp_${VERSION}_${{ matrix.target }}.${{ matrix.archive_ext }}" rms-memory
          if [ "${{ runner.os }}" == "Linux" ]; then
            shopt -s nullglob
            for deb in *.deb; do
              # cargo-deb: rms-memory-mcp_1.0.9-1_amd64.deb → rms_memory_mcp_1.0.9-1_amd64.deb
              mv "$deb" "../${deb/rms-memory-mcp_/rms_memory_mcp_}"
            done
            for rpm in *.rpm; do
              # cargo-generate-rpm: rms-memory-mcp-1.0.9-1.x86_64.rpm → rms_memory_mcp_1.0.9-1.x86_64.rpm
              mv "$rpm" "../${rpm/rms-memory-mcp-/rms_memory_mcp_}"
            done
          fi
        shell: bash

      - name: Package (Windows)
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if (-not $env:VERSION) { throw "VERSION is empty; refusing to produce an unversioned archive." }
          mkdir staging
          cp target\release\rms-memory.exe staging\rms-memory.exe
          cd staging
          Compress-Archive -Path rms-memory.exe -DestinationPath "..\rms_memory_mcp_${env:VERSION}_${{ matrix.target }}.${{ matrix.archive_ext }}"
        shell: pwsh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rms_memory_mcp_${{ matrix.target }}
          path: |
            rms_memory_mcp_${{ needs.plan.outputs.version }}_${{ matrix.target }}.${{ matrix.archive_ext }}
            rms_memory_mcp_*.deb
            rms_memory_mcp_*.rpm
          retention-days: 1

  release:
    name: GitHub Release + Homebrew
    # Uploads built assets onto the release tag (tag push or manual release_tag).
    needs: [plan, build]
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.release_tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.plan.outputs.release_tag }}
          name: ${{ needs.plan.outputs.release_tag }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        run: |
          gh api repos/max-ramas/homebrew-tap/dispatches \
            -f event_type=new-release \
            -f "client_payload[repo]=max-ramas/rms-memory-mcp" \
            -f "client_payload[formula]=rms-memory-mcp" \
            -f "client_payload[bin_name]=rms-memory-mcp" \
            -f "client_payload[tag]=${{ needs.plan.outputs.release_tag }}" \
            -f "client_payload[version]=${{ needs.plan.outputs.version }}"

  publish-crates:
    name: Publish to crates.io
    needs: [plan, build, release]
    runs-on: [self-hosted, linux, x64]
    # Tags publish automatically. Manual dispatch must opt in explicitly.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_crates == true
    environment: crates.io
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.release_tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify requested version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rms-memory-mcp") | .version')"
          test -n "$VERSION"
          test "$package_version" = "$VERSION"

      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-workspace-crates.sh
