[workspace]
members = [
    ".",
    "crates/rms-memory-core",
    "crates/rms-memory-index",
    "crates/rms-memory-vault",
    "crates/rms-memory-cli",
]
resolver = "3"

[package]
name = "rms-memory-mcp"
version = "1.1.0"
edition = "2024"
description = "Persistent, local-first memory for your AI coding agents."
license = "MIT"
repository = "https://github.com/max-ramas/rms-memory-mcp"
authors = ["Maksim Ramzaev <max@rms-ds.com>"]
readme = "README.md"
documentation = "https://docs.rs/rms-memory-mcp"
homepage = "https://rms-ds.com"
keywords = ["mcp", "ai", "memory", "rag", "llm"]
categories = ["command-line-utilities", "database", "development-tools"]
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/rms-memory", dest = "/usr/bin/rms-memory", mode = "755" }
]

[dependencies]
anyhow = "1.0.103"
blake3 = "1.8.5"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
dialoguer = "0.12.0"
directories = "5.0.1"
dirs = "6.0.0"
futures = "0.3.32"
fs2 = "0.4.3"
glob = "0.3.3"
notify = "8.2.0"
pathdiff = "0.2.3"
pulldown-cmark = "0.13.4"
regex = "1.12.4"
rms-memory-core = { version = "=1.1.0", path = "crates/rms-memory-core" }
rms-memory-index = { version = "=1.1.0", path = "crates/rms-memory-index" }
rms-memory-vault = { version = "=1.1.0", path = "crates/rms-memory-vault" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
similar = "3.1.1"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
url = "2.5.8"
tempfile = "3.27.0"
uuid = { version = "1.23.4", features = ["v4"] }
walkdir = "2.5.0"
ignore = "0.4.28"
[[bin]]
name = "rms-memory"
path = "src/main.rs"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"

[dev-dependencies]
